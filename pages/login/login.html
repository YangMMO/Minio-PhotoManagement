<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Minio图片管理系统 | MinIO Photo Manager System</title>
  <link rel="stylesheet" href="../../assets/remixicon.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <!-- 语言切换按钮 -->
  

  <div class="login-container">
    <div class="title">
      <div class="icon"></div>
      <h1 data-i18n="title">MinIO 登录</h1>
    </div>

    <div class="form-group">
      <label for="endPoint" data-i18n="endpoint">端点</label>
      <input type="text" id="endPoint" data-i18n-placeholder="endpoint_placeholder">
    </div>

    <div class="form-group">
      <label for="port" data-i18n="port">端口</label>
      <input type="text" id="port" data-i18n-placeholder="port_placeholder">
    </div>

    <div class="form-group">
      <label for="accessKey" data-i18n="accessKey">Access Key</label>
      <input type="text" id="accessKey" data-i18n-placeholder="accessKey_placeholder">
    </div>

    <div class="form-group">
      <label for="secretKey" data-i18n="secretKey">Secret Key</label>
      <input type="password" id="secretKey" data-i18n-placeholder="secretKey_placeholder">
    </div>

    <div class="form-group">
      <label for="useSSL">
        <input type="checkbox" id="useSSL" style="vertical-align: middle; margin-right: 8px;">
        <span data-i18n="useSSL">使用 HTTPS (SSL)</span>
      </label>
    </div>

    <button id="loginBtn" data-i18n="login">登录</button>
    <div id="loginError" class="error"></div>
    <!-- <label id="langToggle">EN</label> -->
  </div>

  <footer style="text-align:center;color:#e0e0e0;font-size:12px;margin-top:20px;">
    <a href="https://www.mmoo.fun/">© 2025 MMOO.FUN, All rights reserved.</a>
  </footer>

  <script src="../common/lang.js"></script>
  <script src="./login.js"></script>
</body>
</html>
